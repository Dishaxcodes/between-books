<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — Between Books</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            between <span>books</span>
        </div>
    </nav>


    <!-- Signup Form -->
    <section class="form-section">

        <div class="form-card">

            <h2>Create your account</h2>

            <p class="form-subtitle">
                Start finding your next perfect read
            </p>


            <!-- IMPORTANT: No action or method -->
            <form id="signupForm">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit" class="btn-form">
                    Create Account
                </button>

            </form>


            <p class="form-link">

                Already have an account?

                <a href="/login">Login</a>

            </p>

        </div>

    </section>


    <!-- Firebase Signup Script -->
    <script type="module">

        import {
            auth,
            createUserWithEmailAndPassword
        } from "{{ url_for('static', filename='js/firebase.js') }}";


        console.log("Firebase signup script loaded!");


        const form = document.getElementById("signupForm");


        form.addEventListener("submit", async function(event) {

            // Stop normal Flask form submission
            event.preventDefault();


            console.log("Signup button clicked!");


            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                console.log("User created successfully!");

                console.log(userCredential.user);


                alert("Account created successfully! 🎉");


                // Go to preferences page
                window.location.href = "/preferences";


            } catch (error) {

                console.error("Firebase Error:", error);

                alert("Signup failed: " + error.message);

            }

        });

    </script>


</body>
</html>
