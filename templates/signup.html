<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Between Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">between <span>books</span></div>
    </nav>

    <!-- Signup Form -->
    <section class="form-section">
        <div class="form-card">
            <h2>Create your account</h2>
            <p class="form-subtitle">Start finding your next perfect read</p>

            <form action="/signup" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn-form">Create Account</button>
            </form>

            <p class="form-link">Already have an account? <a href="/login">Login</a></p>
        </div>
    </section>

</body>
</html>
