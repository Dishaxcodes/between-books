<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — Between Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .history-container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .history-title {
            color: #26215C;
            font-size: 1.4rem;
            margin-bottom: 0.3rem;
        }
        .history-sub {
            color: #534AB7;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .history-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(83, 74, 183, 0.1);
            border: 1px solid #EEEDFE;
            margin-bottom: 2rem;
        }
        .history-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid #EEEDFE;
        }
        .history-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .history-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #534AB7;
            flex-shrink: 0;
        }
        .history-info {
            flex: 1;
        }
        .history-book-title {
            color: #26215C;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .history-author {
            color: #534AB7;
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }
        .history-date {
            color: #6B6B6B;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .history-emotion {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            background-color: #FAECE7;
            color: #993C1D;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 0.3rem;
        }
        .empty-history {
            text-align: center;
            padding: 3rem;
            color: #534AB7;
        }
        .empty-history p {
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .btn-find-more {
            display: block;
            text-align: center;
            text-decoration: none;
            background-color: #534AB7;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-size: 0.95rem;
            font-family: 'Georgia', serif;
            max-width: 220px;
            margin: 0 auto;
        }
        .btn-find-more:hover {
            background-color: #3C3489;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">between <span>books</span></div>
        <div class="nav-links">
            <a href="/home" class="nav-link">Home</a>
            <div class="avatar">DR</div>
        </div>
    </nav>

    <div class="history-container">
        <h2 class="history-title">Your Reading History</h2>
        <p class="history-sub">Books you have finished reading</p>

        <div class="history-card">
            <!-- Sample entries - will be dynamic later -->
            <div class="history-row">
                <div class="history-dot"></div>
                <div class="history-info">
                    <div class="history-book-title">The Alchemist</div>
                    <div class="history-author">Paulo Coelho</div>
                    <span class="history-emotion">adventurous · hopeful</span>
                </div>
                <div class="history-date">Today</div>
            </div>
            <div class="history-row">
                <div class="history-dot" style="background:#993C1D;"></div>
                <div class="history-info">
                    <div class="history-book-title">Wings of Fire</div>
                    <div class="history-author">A.P.J. Abdul Kalam</div>
                    <span class="history-emotion">inspirational · motivating</span>
                </div>
                <div class="history-date">2 weeks ago</div>
            </div>
            <div class="history-row">
                <div class="history-dot"></div>
                <div class="history-info">
                    <div class="history-book-title">Chanakya Neeti</div>
                    <div class="history-author">B.K. Chaturvedi</div>
                    <span class="history-emotion">philosophical · wise</span>
                </div>
                <div class="history-date">1 month ago</div>
            </div>
        </div>

        <a href="/home" class="btn-find-more">Find my next book →</a>
    </div>

</body>
</html>
