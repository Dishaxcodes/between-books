<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Between Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">between <span>books</span></div>
    </nav>

    <!-- Login Form -->
    <section class="form-section">
        <div class="form-card">
            <h2>Welcome back</h2>
            <p class="form-subtitle">Login to find your next perfect read</p>

            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-form">Login</button>
            </form>

            <p class="form-link">Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </section>

</body>
</html>
